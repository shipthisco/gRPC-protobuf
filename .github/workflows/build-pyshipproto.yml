name: Build and Publish PyShipProto

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.6.3)'
        required: true
        default: '2.6.3'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
        pip install grpcio-tools
        pip install 'protobuf>=4.21.0,<7.0.0'

    - name: Generate Library
      run: |
        cd scripts/python
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="2.6.3"
        fi
        python generate_lib.py $VERSION

    - name: Check and Upload to PyPI
      if: github.event.inputs.version != ''
      run: |
        cd scripts/python

        # Get the latest dist files
        DIST_FILES=$(ls -t dist/*.whl dist/*.tar.gz 2>/dev/null | head -n 2)

        # Check the distribution files
        if [ -n "$DIST_FILES" ]; then
          echo "Checking distribution files: $DIST_FILES"
          twine check $DIST_FILES

          # Upload to PyPI if API key is available
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            twine upload $DIST_FILES --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}
          else
            echo "No PyPI API token found, skipping upload"
          fi
        else
          echo "No distribution files found"
          exit 1
        fi

    - name: Release
      run: echo "🚀 Build complete!"