name: Build and Publish PyShipProto

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.6.3)'
        required: true
        default: '2.6.3'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
        pip install grpcio-tools>=1.71.0
        pip install protobuf>=4.21.0,<7.0.0

    - name: Set version
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=${{ github.event.inputs.version }}
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Generate protobuf files
      run: |
        cd scripts/python
        python generate_lib.py ${{ env.VERSION }}

    - name: Build package
      run: |
        cd scripts/python
        python setup.py sdist bdist_wheel

    - name: Check package
      run: |
        cd scripts/python
        pip install dist/pyshipproto-${{ env.VERSION }}-py3-none-any.whl
        python -c "import pyshipproto; print('Package import successful')"

    - name: Publish to PyPI
      if: github.event_name == 'push' || github.event.inputs.version != ''
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        cd scripts/python
        python -m twine upload dist/*