syntax = "proto3";

package executor;

// Common request structure for both JS and Python
message ExecutorRequest {
    string data = 1;
    string location = 2;
    string region = 3;
    string organisation = 4;
    string code = 5;
}

// Response message containing the execution result
message ExecutorResponse {
    string result = 1;
}

// Code execution service with language-specific RPCs
service ExecutorService {
    rpc xrunJavascript (ExecutorRequest) returns (ExecutorResponse);
    rpc xrunPython (ExecutorRequest) returns (ExecutorResponse);
}